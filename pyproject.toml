[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantframe"
version = "0.1.0"
description = "Phase-1 US equities quantitative trading framework (daily OHLCV backtests)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "quantframe" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quantframe = "quantframe.cli:main"

[project.urls]
Homepage = "https://github.com/alan861130/grok_bot_project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
